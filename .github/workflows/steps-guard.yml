name: steps-guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  steps-guard:
    name: steps-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check branch name, step record and commit trailers
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0

          # 1. The branch is step/<issue number padded to 3 digits>-<slug>.
          if [[ ! "$BRANCH" =~ ^step/([0-9]{3})-[a-z0-9-]+$ ]]; then
            echo "::error::Branch '$BRANCH' must be named step/<3-digit issue number>-<slug>, e.g. step/014-play-reviews for issue #14"
            exit 1
          fi
          num="${BASH_REMATCH[1]}"
          id=$((10#$num))

          # 2. Merged step records are frozen: this PR may only add new ones.
          while IFS=$'\t' read -r status path _; do
            [ -z "$status" ] && continue
            if [ "$status" != "A" ]; then
              echo "::error file=$path::Step records are frozen once merged. Open a new step instead of changing $path"
              fail=1
            fi
          done < <(git diff --name-status "$BASE...$HEAD_SHA" -- 'docs/steps/[0-9]*.md')

          # 3. The PR adds its own record.
          if ! git diff --name-only --diff-filter=A "$BASE...$HEAD_SHA" -- "docs/steps/${num}-*.md" | grep -q .; then
            echo "::error::Add your step record as docs/steps/${num}-<slug>.md (copy docs/steps/_template.md)"
            fail=1
          fi

          # 4. Every commit on the branch ends with the trailer for this step.
          #    Commits that came in by merging main are skipped.
          for sha in $(git rev-list --no-merges "$HEAD_SHA" --not "$BASE"); do
            step=$(git log -1 --format='%(trailers:key=Step,valueonly)' "$sha" | tr -d '[:space:]')
            # Accept "#14" or "#014"; both mean issue 14.
            if ! [[ "$step" =~ ^#([0-9]+)$ ]] || (( 10#${BASH_REMATCH[1]} != id )); then
              echo "::error::Commit $(git log -1 --format='%h "%s"' "$sha") needs the trailer 'Step: #${id}' as its last line"
              fail=1
            fi
          done

          exit "$fail"
